<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FedHeal — Hospital Dashboard</title>
<style>
  /* Deliberately minimal — wiring first, per this sprint's goal.
     Swap for the real design system once Module 1/2 endpoints are stable. */
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; color: #222; }
  h1 { font-size: 1.4rem; }
  section { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  label { display: block; margin-top: 8px; font-size: 0.9rem; color: #555; }
  input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
  button { margin-top: 12px; padding: 8px 16px; cursor: pointer; }
  .error { color: #b00020; font-size: 0.9rem; margin-top: 8px; }
  .hidden { display: none; }
  .status-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #eee; }
  #api-base { font-size: 0.8rem; color: #888; }
</style>
</head>
<body>

<h1>FedHeal — Hospital Dashboard</h1>
<p id="api-base"></p>

<section id="login-section">
  <h2>Log in</h2>
  <label>Email
    <input id="email" type="email" value="doc@general.com">
  </label>
  <label>Password
    <input id="password" type="password" value="hunter2">
  </label>
  <button id="login-btn">Log in</button>
  <div id="login-error" class="error hidden"></div>
</section>

<section id="status-section" class="hidden">
  <h2>Your hospital's status</h2>
  <div id="whoami"></div>
  <div id="training-status">Loading…</div>
  <button id="refresh-btn">Refresh</button>
  <button id="logout-btn">Log out</button>
</section>

<script>
// Module 1's auth service. Change this if you run it on a different host/port.
const AUTH_API_BASE = "http://localhost:8001";
document.getElementById("api-base").textContent = `Talking to auth API at ${AUTH_API_BASE}`;

let token = localStorage.getItem("fedmed_token"); // fine for local dev; swap for a
                                                    // non-JS-readable cookie before real deployment

function showError(elId, message) {
  const el = document.getElementById(elId);
  el.textContent = message;
  el.classList.remove("hidden");
}

function clearError(elId) {
  document.getElementById(elId).classList.add("hidden");
}

async function login(email, password) {
  // Module 1's /token endpoint expects an OAuth2 password form, not JSON.
  const body = new URLSearchParams();
  body.set("username", email);
  body.set("password", password);

  const resp = await fetch(`${AUTH_API_BASE}/token`, {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body,
  });
  if (!resp.ok) {
    const detail = await resp.json().catch(() => ({}));
    throw new Error(detail.detail || `Login failed (${resp.status})`);
  }
  const data = await resp.json();
  return data.access_token;
}

async function authedGet(path) {
  const resp = await fetch(`${AUTH_API_BASE}${path}`, {
    headers: { Authorization: `Bearer ${token}` },
  });
  if (!resp.ok) {
    if (resp.status === 401) {
      // token expired/invalid — force re-login rather than showing a confusing error
      logout();
      throw new Error("Session expired, please log in again.");
    }
    throw new Error(`Request to ${path} failed (${resp.status})`);
  }
  return resp.json();
}

function renderTrainingStatus(status) {
  const el = document.getElementById("training-status");
  // super_admin sees a dict of {hospital_id: status}; everyone else sees one status object
  if (status.round !== undefined) {
    el.innerHTML = `
      <div class="status-row"><span>Round</span><span>${status.round}</span></div>
      <div class="status-row"><span>Status</span><span>${status.status}</span></div>
      <div class="status-row"><span>Last sync</span><span>${status.last_sync ?? "never"}</span></div>
    `;
  } else {
    el.innerHTML = "<em>Admin view — per-hospital status not yet rendered. See raw response:</em>"
      + `<pre>${JSON.stringify(status, null, 2)}</pre>`;
  }
}

async function loadDashboard() {
  const me = await authedGet("/me");
  document.getElementById("whoami").innerHTML =
    `Logged in as <strong>${me.email}</strong> (${me.role}, hospital_id: ${me.hospital_id ?? "—"})`;

  const status = await authedGet("/training-status");
  renderTrainingStatus(status);
}

function logout() {
  token = null;
  localStorage.removeItem("fedmed_token");
  document.getElementById("status-section").classList.add("hidden");
  document.getElementById("login-section").classList.remove("hidden");
}

document.getElementById("login-btn").addEventListener("click", async () => {
  clearError("login-error");
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  try {
    token = await login(email, password);
    localStorage.setItem("fedmed_token", token);
    document.getElementById("login-section").classList.add("hidden");
    document.getElementById("status-section").classList.remove("hidden");
    await loadDashboard();
  } catch (err) {
    showError("login-error", err.message);
  }
});

document.getElementById("refresh-btn").addEventListener("click", loadDashboard);
document.getElementById("logout-btn").addEventListener("click", logout);

// If we already have a token from a previous session, skip straight to the dashboard.
if (token) {
  document.getElementById("login-section").classList.add("hidden");
  document.getElementById("status-section").classList.remove("hidden");
  loadDashboard().catch((err) => {
    showError("login-error", err.message);
    logout();
  });
}
</script>

</body>
</html>
