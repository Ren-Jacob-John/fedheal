# Alembic configuration for Module 1 (auth / hospitals / vitals).
#
# Sprint A (docs/DEVELOPMENT_PLAN.md): "begin the Alembic migration setup".
# Sprint B finishes it — migrations applied to the staging database and
# Base.metadata.create_all() retired for good.
#
# NOTE: sqlalchemy.url is deliberately EMPTY here. The connection string
# lives in FEDHEAL_DATABASE_URL (the same env var database.py reads), and
# migrations/env.py pulls it from there at runtime. Putting it in this file
# would mean a Supabase password sitting in version control, which is
# exactly what week 13's secrets work was about avoiding.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
