# Full local stack. DRAFT (Sprint C): validated as YAML, not yet built/run in
# an environment with Docker. Usage:
#   cp deploy/compose.env.example .env   # then replace every CHANGE_ME
#   docker compose up --build
# Every secret is required (":?"); compose refuses to start with one unset.
# First login: docker compose exec -e FEDHEAL_BOOTSTRAP_ADMIN_PASSWORD=... auth python create_super_admin.py --email you@example.org
# (public registration is closed; hospital admins create doctors).
x-common: &common
  restart: unless-stopped
  env_file: .env

# Module 1 and Module 7 talk to the Firestore emulator below. Both use the same project; their
# collection names don't collide (Module 7 may be given its own database: FEDHEAL_ADMIN_FIRESTORE_DATABASE).
x-firestore-env: &firestore-env
  FEDHEAL_DB_BACKEND: firestore
  FEDHEAL_FIREBASE_PROJECT_ID: ${FEDHEAL_FIREBASE_PROJECT_ID:-demo-fedheal}
  FIRESTORE_EMULATOR_HOST: firestore:8080

services:
  firestore:       # Firebase Firestore EMULATOR for local runs (in-memory: data is lost when it stops).
    # Staging/production use real Firestore instead: drop this service, remove FIRESTORE_EMULATOR_HOST
    # below and provide GOOGLE_APPLICATION_CREDENTIALS (see docs/FIRESTORE_MIGRATION.md).
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    restart: unless-stopped
    command: ["gcloud", "emulators", "firestore", "start", "--host-port=0.0.0.0:8080"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('localhost',8080),timeout=3); s.close()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  auth:            # Module 1
    <<: *common
    build: {context: ., dockerfile: module1-auth/Dockerfile}
    environment:
      <<: *firestore-env
      FEDHEAL_VALIDATION_API_URL: http://validation:8002
    depends_on:
      firestore: {condition: service_healthy}
      validation: {condition: service_healthy}
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  validation:      # Module 2
    <<: *common
    build: {context: ., dockerfile: module2-validation/Dockerfile}
    environment:
      FEDHEAL_ADMIN_API_URL: http://admin:8005
    ports: ["8002:8002"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  admin:           # Module 7
    <<: *common
    build: {context: ., dockerfile: module7-admin/Dockerfile}
    environment:
      <<: *firestore-env
      FEDMED_AUTH_API_URL: http://auth:8001
    depends_on:
      firestore: {condition: service_healthy}
      auth: {condition: service_healthy}
    ports: ["8005:8005"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  synthesis:       # Module 8 (Modules 5 and 6 are bundled into this image)
    <<: *common
    build: {context: ., dockerfile: module8-synthesis/Dockerfile}
    environment:
      FEDHEAL_AUTH_API_URL: http://auth:8001
      FEDHEAL_ADMIN_API_URL: http://admin:8005     # where the PROMOTED model is read from
    depends_on:
      auth: {condition: service_healthy}
      admin: {condition: service_healthy}
    ports: ["8006:8006"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  fl-server:       # Module 3 Flower server; Compose uses plaintext by default (TLS options exist in M3)
    <<: *common
    profiles: [federation]
    build: {context: ., dockerfile: module3-fedlearning/Dockerfile}
    depends_on:
      admin: {condition: service_healthy}
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost',8080),timeout=3); s.close()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  dashboard:       # Module 4; VITE_* URLs are baked in at build time
    build:
      context: .
      dockerfile: module4-dashboard-react/Dockerfile
      args:
        VITE_AUTH_API_BASE: ${PUBLIC_AUTH_URL:-http://localhost:8001}
        VITE_ADMIN_API_BASE: ${PUBLIC_ADMIN_URL:-http://localhost:8005}
        VITE_SYNTHESIS_API_BASE: ${PUBLIC_SYNTHESIS_URL:-http://localhost:8006}
    restart: unless-stopped
    ports: ["5173:80"]
